name: Bug
description: Something is wrong or broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: OpenLens version
      description: Shown in the dashboard footer, or `openlens --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run it?
      options: [Docker, Coolify, Kubernetes / Helm, Binary, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, keys and personal data first.
      render: text
