name: CI

# PR gate = the fast checks (target: ~5 min with a warm cache).
# The slow end-to-end checks (Docker image + smoke, real browser) run on
# every push to main, nightly and on demand; a failure there opens an issue.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other; main runs never cancel each other, so the
# end-to-end checks complete for every merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci

  sdk:
    name: sdk (build, size budget, committed bundle up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm run check
          git diff --exit-code -- dist || (echo "::error::sdk/js/dist is stale: run npm run build and commit"; exit 1)

  docker:
    name: docker image + end-to-end smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENLENS_ADMIN_TOKEN: adm_ci_smoke
      OPENLENS_PROJECT_KEY: pk_ci_smoke
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openlens-openlens:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose up -d --wait --wait-timeout 60
      - run: scripts/smoke.sh http://localhost:8686
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  browser:
    name: browser e2e (one script tag, real server)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo build -p openlens
      - name: install Playwright + Chromium (next to the script, for ESM resolution)
        working-directory: scripts/e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: run
        run: |
          OPENLENS_DATA_DIR=$RUNNER_TEMP/ol OPENLENS_ADMIN_TOKEN=adm_ci OPENLENS_PROJECT_KEY=pk_ci \
            ./target/debug/openlens > $RUNNER_TEMP/ol.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8686/healthz && break; sleep 1; done
          node scripts/e2e/browser.mjs http://localhost:8686 pk_ci
      - if: failure()
        run: cat $RUNNER_TEMP/ol.log

  report:
    name: open an issue when main breaks
    needs: [gate, sdk, docker, browser]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "main is broken: CI failed on ${GITHUB_SHA::7}" \
            --body "The end-to-end CI failed on main ($GITHUB_EVENT_NAME). Run: $RUN. Fix before merging new work."
