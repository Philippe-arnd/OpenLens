name: CI

# PR gate: fmt, clippy, tests (incl. HTTP integration tests of every route),
# layers, licences, SDK budget. ~2.5 min with a warm cache.
# Browser e2e: only when the SDK or the capture path changes, and nightly.
# Docker packaging is tested in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other; main runs never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.f.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then echo browser=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then git fetch -q --depth=1 origin "$BASE"; RANGE="$BASE...HEAD"; else RANGE="HEAD~1...HEAD"; fi
          if git diff --name-only $RANGE | grep -qE '^(sdk/|crates/server/src/capture\.rs|crates/server/src/replay\.rs|crates/replay/|crates/server/src/lib\.rs|crates/event/|scripts/e2e/)'; then
            echo browser=true >> "$GITHUB_OUTPUT"; else echo browser=false >> "$GITHUB_OUTPUT"; fi

  gate:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci

  advisories:
    # Known vulnerabilities in dependencies (RustSec). Separate from the
    # gate: a new advisory should not block unrelated work, but it shows
    # red on every PR and nightly until a dependency update fixes it.
    name: dependency advisories (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  sdk:
    name: sdk (build, size budget, committed bundle up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm run check
          git diff --exit-code -- dist || (echo "::error::sdk/js/dist is stale: run npm run build and commit"; exit 1)
      - name: server SDKs (Node, Python, Go, Ruby, PHP; the runner's toolchains)
        run: |
          (cd sdk/node && npm test)
          (cd sdk/python && python3 -m unittest discover -s tests)
          (cd sdk/go && go vet ./... && go test -race ./...)
          (cd sdk/ruby && ruby -w -Ilib test/test_client.rb)
          (cd sdk/php && php -l src/OpenLens.php && php tests/test.php)

  browser:
    name: browser e2e (one script tag, real server)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate
          save-if: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1
      - run: cargo build -p openlens
      - name: install Playwright (next to the script, for ESM resolution)
        working-directory: scripts/e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium
      - name: run
        run: |
          OPENLENS_DATA_DIR=$RUNNER_TEMP/ol OPENLENS_ADMIN_TOKEN=adm_ci OPENLENS_PROJECT_KEY=pk_ci \
            ./target/debug/openlens > $RUNNER_TEMP/ol.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8686/healthz && break; sleep 1; done
          node scripts/e2e/browser.mjs http://localhost:8686 pk_ci adm_ci
      - name: dashboard under the real CSP, light and dark (nightly / on demand)
        if: github.event_name != 'pull_request'
        run: |
          cargo build -p xtask
          ./target/debug/xtask demo $RUNNER_TEMP/demo
          OPENLENS_DATA_DIR=$RUNNER_TEMP/demo OPENLENS_ADDR=127.0.0.1:8687 OPENLENS_ADMIN_TOKEN=adm_ci \
            ./target/debug/openlens > $RUNNER_TEMP/demo.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8687/healthz && break; sleep 1; done
          node scripts/e2e/screens.mjs http://localhost:8687 adm_ci $RUNNER_TEMP/screens
      - name: reference apps wired by the agent guide reach a green verify (M2 exit; nightly / on demand)
        if: github.event_name != 'pull_request'
        env:
          OPENLENS_SERVER: http://localhost:8686
          OPENLENS_TOKEN: adm_ci
        run: |
          cargo build -p openlens-cli
          scripts/e2e/reference.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: player-screens
          path: ${{ runner.temp }}/player-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dashboard-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        run: cat $RUNNER_TEMP/ol.log $RUNNER_TEMP/demo.log $RUNNER_TEMP/notes-ssr.log $RUNNER_TEMP/tasks-spa.log 2>/dev/null || true

  report:
    name: open an issue when main breaks
    needs: [gate, sdk, browser]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "main is broken: CI failed on ${GITHUB_SHA::7}" \
            --body "CI failed on main ($GITHUB_EVENT_NAME). Run: $RUN. Fix before merging new work."

  advisory-report:
    # One issue per open advisory state (label security-advisory): opened or
    # updated when the RustSec check fails on main or nightly, closed when it
    # is green again. Renovate's vulnerability PRs usually fix it (#196).
    name: track dependency advisories
    needs: [advisories]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.advisories.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security-advisory -R "$GITHUB_REPOSITORY" --color B60205 --description "A dependency has a RustSec advisory" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label security-advisory --state open --json number -q '.[0].number')
          if [ "$RESULT" = failure ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --label security-advisory \
                --title "Dependency advisory: cargo deny check advisories fails on main" \
                --body "The RustSec check failed on main ($GITHUB_EVENT_NAME). Details: $RUN. Fix by updating the dependency (Renovate opens a PR for fixable ones), or add a reasoned ignore to deny.toml when no fix exists."
            fi
          elif [ "$RESULT" = success ] && [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "The RustSec check is green again: $RUN"
          fi
