name: CI

# PR gate: fmt, clippy, tests (incl. HTTP integration tests of every route),
# layers, licences, SDK budget. ~2.5 min with a warm cache.
# Browser e2e: only when the SDK or the capture path changes, and nightly.
# Docker packaging is tested in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other; main runs never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.f.outputs.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then echo browser=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then git fetch -q --depth=1 origin "$BASE"; RANGE="$BASE...HEAD"; else RANGE="HEAD~1...HEAD"; fi
          if git diff --name-only $RANGE | grep -qE '^(sdk/|crates/server/src/capture\.rs|crates/server/src/lib\.rs|crates/event/|scripts/e2e/)'; then
            echo browser=true >> "$GITHUB_OUTPUT"; else echo browser=false >> "$GITHUB_OUTPUT"; fi

  gate:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci

  sdk:
    name: sdk (build, size budget, committed bundle up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm run check
          git diff --exit-code -- dist || (echo "::error::sdk/js/dist is stale: run npm run build and commit"; exit 1)

  browser:
    name: browser e2e (one script tag, real server)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          save-if: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1
      - run: cargo build -p openlens
      - name: install Playwright (next to the script, for ESM resolution)
        working-directory: scripts/e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: run
        run: |
          OPENLENS_DATA_DIR=$RUNNER_TEMP/ol OPENLENS_ADMIN_TOKEN=adm_ci OPENLENS_PROJECT_KEY=pk_ci \
            ./target/debug/openlens > $RUNNER_TEMP/ol.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8686/healthz && break; sleep 1; done
          node scripts/e2e/browser.mjs http://localhost:8686 pk_ci
      - if: failure()
        run: cat $RUNNER_TEMP/ol.log

  report:
    name: open an issue when main breaks
    needs: [gate, sdk, browser]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "main is broken: CI failed on ${GITHUB_SHA::7}" \
            --body "CI failed on main ($GITHUB_EVENT_NAME). Run: $RUN. Fix before merging new work."
