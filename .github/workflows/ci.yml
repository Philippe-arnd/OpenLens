name: CI

# PR gate: fmt, clippy, tests (incl. HTTP integration tests of every route),
# layers, licences, SDK budget. ~2.5 min with a warm cache.
# Browser e2e: only when the SDK or the capture path changes, and nightly;
# the dashboard check (CSP, WCAG 2.2 AA, keyboard) also when the UI changes.
# Docker packaging is tested in release.yml.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other; main runs never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.f.outputs.browser }}
      ui: ${{ steps.f.outputs.ui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then { echo browser=true; echo ui=true; } >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then git fetch -q --depth=1 origin "$BASE"; RANGE="$BASE...HEAD"; else RANGE="HEAD~1...HEAD"; fi
          if git diff --name-only $RANGE | grep -qE '^(sdk/|crates/server/src/capture\.rs|crates/server/src/replay\.rs|crates/replay/|crates/server/src/lib\.rs|crates/event/|scripts/e2e/)'; then
            echo browser=true >> "$GITHUB_OUTPUT"; else echo browser=false >> "$GITHUB_OUTPUT"; fi
          # The dashboard pages (#303): their accessibility and CSP check runs on the PR too.
          if git diff --name-only $RANGE | grep -qE '^(crates/ui/|crates/server/src/web\.rs|scripts/e2e/)'; then
            echo ui=true >> "$GITHUB_OUTPUT"; else echo ui=false >> "$GITHUB_OUTPUT"; fi

  gate:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci

  advisories:
    # Known vulnerabilities in dependencies (RustSec). Separate from the
    # gate: a new advisory should not block unrelated work, but it shows
    # red on every PR and nightly until a dependency update fixes it.
    name: dependency advisories (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  sdk:
    name: sdk (build, size budget, committed bundle up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm run check
          git diff --exit-code -- dist || (echo "::error::sdk/js/dist is stale: run npm run build and commit"; exit 1)
      - name: server SDKs (Node, Python, Go, Ruby, PHP; the runner's toolchains)
        run: |
          (cd sdk/node && npm test)
          (cd sdk/python && python3 -m unittest discover -s tests)
          (cd sdk/go && go vet ./... && go test -race ./...)
          (cd sdk/ruby && ruby -w -Ilib test/test_client.rb)
          (cd sdk/php && php -l src/OpenLens.php && php tests/test.php)

  browser:
    name: browser e2e (one script tag, real server)
    needs: changes
    # Heavy: release tags, nightly and on demand only, so a pull request
    # waits for the gate alone (about 5 minutes).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate
          save-if: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1
      - run: cargo build -p openlens
      - name: install Playwright (next to the script, for ESM resolution)
        working-directory: scripts/e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium
      - name: run
        run: |
          OPENLENS_DATA_DIR=$RUNNER_TEMP/ol OPENLENS_ADMIN_TOKEN=adm_ci OPENLENS_PROJECT_KEY=pk_ci \
            ./target/debug/openlens > $RUNNER_TEMP/ol.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8686/healthz && break; sleep 1; done
          node scripts/e2e/browser.mjs http://localhost:8686 pk_ci adm_ci
      - name: dashboard under the real CSP, light and dark, WCAG 2.2 AA and keyboard (nightly, on demand, and PRs that touch the UI)
        if: github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true'
        run: |
          cargo build -p xtask
          ./target/debug/xtask demo $RUNNER_TEMP/demo
          OPENLENS_DATA_DIR=$RUNNER_TEMP/demo OPENLENS_ADDR=127.0.0.1:8687 OPENLENS_ADMIN_TOKEN=adm_ci \
            ./target/debug/openlens > $RUNNER_TEMP/demo.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8687/healthz && break; sleep 1; done
          node scripts/e2e/screens.mjs http://localhost:8687 adm_ci $RUNNER_TEMP/screens
      - name: reference apps wired by the agent guide reach a green verify (M2 exit; nightly / on demand)
        if: github.event_name != 'pull_request'
        env:
          OPENLENS_SERVER: http://localhost:8686
          OPENLENS_TOKEN: adm_ci
        run: |
          cargo build -p openlens-cli
          scripts/e2e/reference.sh
      - name: reference numbers for the README badge (#305)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reference-numbers
          path: |
            ${{ runner.temp }}/reference.json
            ${{ runner.temp }}/badges/wiring.json
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: player-screens
          path: ${{ runner.temp }}/player-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dashboard-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        run: cat $RUNNER_TEMP/ol.log $RUNNER_TEMP/demo.log $RUNNER_TEMP/notes-ssr.log $RUNNER_TEMP/tasks-spa.log 2>/dev/null || true

  report:
    # One `main-broken` issue at a time (#200): opened when a job fails on
    # main (push, nightly, on demand), a comment on the open one when it
    # fails again, closed once every job it lists has passed again. The
    # failed jobs are listed in a marker in the issue body, so a push that
    # skips the browser e2e does not close an issue about it.
    # A first attempt that fails is re-run once by flaky.yml: the issue
    # waits for that second attempt, so a flaky job files `flaky` instead.
    name: open an issue when main breaks
    needs: [changes, gate, sdk, browser]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ATTEMPT: ${{ github.run_attempt }}
          RESULTS: |
            changes ${{ needs.changes.result }}
            gate ${{ needs.gate.result }}
            sdk ${{ needs.sdk.result }}
            browser ${{ needs.browser.result }}
        run: |
          failed=$(awk '$2 == "failure" { print $1 }' <<< "$RESULTS" | xargs)
          passed=$(awk '$2 == "success" { print $1 }' <<< "$RESULTS" | xargs)
          if [ -n "$failed" ] && [ "$ATTEMPT" = 1 ]; then
            echo "failed: $failed; flaky.yml re-runs it once, the second attempt reports"; exit 0
          fi
          gh label create main-broken -R "$GITHUB_REPOSITORY" --color B60205 --description "CI failed on main" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label main-broken --state open --json number -q '.[0].number')
          if [ -z "$open" ]; then
            # Issues opened before the label existed.
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "main is broken"' --json number -q '.[0].number')
            if [ -n "$open" ]; then gh issue edit "$open" -R "$GITHUB_REPOSITORY" --add-label main-broken; fi
          fi
          listed=""
          if [ -n "$open" ]; then
            listed=$(gh issue view "$open" -R "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/^<!-- failed-jobs: \(.*\) -->$/\1/p' | head -n 1)
          fi
          if [ -n "$failed" ]; then
            marker="<!-- failed-jobs: $(tr ' ' '\n' <<< "$listed $failed" | grep . | sort -u | xargs) -->"
            if [ -n "$open" ]; then
              body=$(gh issue view "$open" -R "$GITHUB_REPOSITORY" --json body -q .body | grep -v '^<!-- failed-jobs: ' || true)
              gh issue edit "$open" -R "$GITHUB_REPOSITORY" --body "$body"$'\n'"$marker"
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing on ${GITHUB_SHA::7} ($GITHUB_EVENT_NAME): $failed. Run: $RUN"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --label main-broken \
                --title "main is broken: CI failed on ${GITHUB_SHA::7}" \
                --body "CI failed on main ($GITHUB_EVENT_NAME), twice on the same commit: $failed. Run: $RUN. Fix before merging new work. This issue is closed by CI once these jobs pass on main again."$'\n'"$marker"
            fi
          elif [ -n "$open" ]; then
            # Close only when every job the issue lists ran and passed.
            for job in ${listed:-gate sdk}; do
              case " $passed " in *" $job "*) ;; *) echo "$job did not run in this run: keeping #$open open"; exit 0 ;; esac
            done
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Green again on ${GITHUB_SHA::7}: $RUN"
          fi

  advisory-report:
    # One issue per open advisory state (label security-advisory): opened or
    # updated when the RustSec check fails on main or nightly, closed when it
    # is green again. Renovate's vulnerability PRs usually fix it (#196).
    name: track dependency advisories
    needs: [advisories]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.advisories.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security-advisory -R "$GITHUB_REPOSITORY" --color B60205 --description "A dependency has a RustSec advisory" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label security-advisory --state open --json number -q '.[0].number')
          if [ "$RESULT" = failure ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --label security-advisory \
                --title "Dependency advisory: cargo deny check advisories fails on main" \
                --body "The RustSec check failed on main ($GITHUB_EVENT_NAME). Details: $RUN. Fix by updating the dependency (Renovate opens a PR for fixable ones), or add a reasoned ignore to deny.toml when no fix exists."
            fi
          elif [ "$RESULT" = success ] && [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "The RustSec check is green again: $RUN"
          fi
