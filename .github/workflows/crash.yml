name: crash

# The durability proof (#331): every night, `cargo xtask crash` SIGKILLs the
# real server 50+ times over 5 minutes while it ingests, then checks that no
# acknowledged event is lost or stored twice. A failure uploads the report
# and server log, and opens (or updates) one issue with the seed to replay.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash:
    name: kill the server while it ingests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p openlens -p xtask
      - name: 5 minutes, at least 50 kills
        run: set -o pipefail; cargo xtask crash --secs 300 --kills 50 | tee crash-report.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crash-report
          path: |
            crash-report.json
            /tmp/openlens-crash-*.log
          if-no-files-found: ignore

  report:
    name: open an issue on a failure
    needs: [crash]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="crash test: events lost or duplicated"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          body="The nightly crash test failed on ${GITHUB_SHA::7}. Report (with the seed) and server log: $RUN. Replay locally with \`cargo xtask crash --seed <seed>\`."
          if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
