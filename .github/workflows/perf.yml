name: perf

# Nightly benchmark (#314): the perf build on a demo data dir, one minute
# of ingestion, then one minute of ingestion while two readers compute
# the board (`xtask bench --with-board`). The JSON is kept as an artifact
# and checked by scripts/perf/compare.py: a missed target (fixed, from the
# footprint decision) fails the run; a metric more than 20 % worse than
# the last 7 runs on main is a trend, reported on one issue without
# failing. Every night also measures the board at scale (4 M events,
# realistic profile, 1 GiB cap).
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      scale_events:
        description: "Also run the scale measurement (#321): event counts, comma-separated (0: skip)"
        default: "0"
      scale_memory:
        description: "Memory caps for the scale server, comma-separated, e.g. 1G,2G (empty: no cap) (#460)"
        default: ""
      scale_profile:
        description: "bench-gen profile: realistic (#443), persona (#706: 68000000 events is its full size, fewer scale its users) or uniform"
        type: choice
        default: realistic
        options:
          - realistic
          - persona
          - uniform

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The perf build, once per run: `bench` and every `scale` job download
  # these three binaries instead of compiling them again.
  build:
    name: perf build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: perf
      - run: cargo build --profile perf -p openlens -p openlens-cli -p xtask
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-bin
          path: |
            target/perf/openlens
            target/perf/openlens-cli
            target/perf/xtask
          if-no-files-found: error
          retention-days: 1

  bench:
    name: ingestion and board
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: perf-bin
          path: bin
      # An artifact does not keep the exec bit.
      - run: chmod +x bin/openlens bin/openlens-cli bin/xtask
      - name: run
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/data"; ./bin/xtask demo "$D"
          OPENLENS_DATA_DIR="$D" OPENLENS_ADDR=127.0.0.1:18740 OPENLENS_ADMIN_TOKEN=perf ./bin/openlens > server.log 2>&1 &
          for _ in $(seq 60); do curl -sf 127.0.0.1:18740/healthz > /dev/null && break; sleep 1; done
          KEY=$(curl -sf -H "authorization: Bearer perf" 127.0.0.1:18740/api/projects | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("projects", d); print(next(p for p in d if p["id"]=="default")["key"])')
          ./bin/xtask bench http://127.0.0.1:18740 "$KEY" 60 4 50 > ingest.json
          export OPENLENS_BENCH_COOKIE=$(curl -si -XPOST 127.0.0.1:18740/login -d token=perf | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: \(ol_session=[^;]*\).*/\1/p')
          ./bin/xtask bench http://127.0.0.1:18740 "$KEY" 60 4 50 --with-board default > with_board.json
          python3 -c 'import json; print(json.dumps({"sha": "'"$GITHUB_SHA"'", "ingest": json.load(open("ingest.json")), "with_board": json.load(open("with_board.json"))}))' > perf.json
          cat perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Also when the bench fails: server.log is how a failed request is
        # explained.
        if: always()
        with:
          name: perf
          path: |
            perf.json
            server.log
      - name: compare with the last 7 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last runs on main, failed or not: a run that failed (a
          # missed target, a trend) still uploads perf.json, and leaving
          # it out froze the average on the last green nights (#578).
          # Branch runs stay out. Runs without perf.json are skipped.
          mkdir -p earlier
          n=0
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow perf.yml --branch main --limit 20 --json databaseId,status -q '.[] | select(.status == "completed") | .databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n perf -D "earlier/$id" > /dev/null 2>&1 || continue
            [ -f "earlier/$id/perf.json" ] || continue
            n=$((n + 1)); [ "$n" -ge 7 ] && break
          done
          set +e; python3 scripts/perf/compare.py perf.json earlier > report.md; code=$?; set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "regressed=$code" >> "$GITHUB_ENV"
      # 1: a target missed (the run fails); 2: a trend only (reported).
      - name: open or update the issue
        if: (env.regressed == '1' || env.regressed == '2') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="perf: nightly benchmark regressed"
          { cat report.md; echo; echo "Run: $RUN (${GITHUB_SHA::7})."; } > body.md
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file body.md; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi
      - name: fail on a missed target
        if: env.regressed == '1'
        run: exit 1

  # Board latency and memory at scale (#321), by hand only: a synthetic app
  # written by `xtask bench-gen`, then the board computed cold and warm,
  # with the server's peak memory. One job per event count: the app is
  # generated once (or restored from the cache), then each memory cap is
  # measured in turn on a fresh copy of it (.github/scripts/perf-scale-cap.sh).
  # The cap is a cgroup v2 limit, which the server reads for its query
  # budget (#444). The server is left to finish its rollups before
  # measuring, and the cold board is measured three times, each after a
  # restart (#460). Each cap keeps its own artifact, scale-EVENTS-CAP.
  scale-matrix:
    name: scale plan
    # By hand with scale_events, and every night at 4 M events, realistic
    # profile, under 1 GiB: the size the footprint decision promises.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scale_events != '0')
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - id: plan
        env:
          EVENTS: ${{ github.event_name == 'schedule' && '4000000' || inputs.scale_events }}
          MEMORY: ${{ github.event_name == 'schedule' && '1G' || inputs.scale_memory }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          ev = [e for e in os.environ["EVENTS"].replace(" ", "").split(",") if re.fullmatch(r"[0-9]{1,9}", e)]
          mem = [m for m in os.environ["MEMORY"].replace(" ", "").split(",") if re.fullmatch(r"[0-9]{1,4}[MG]", m)][:3] or ["nocap"]
          c = (mem + ["", ""])[:3]
          print("plan=" + json.dumps([{"events": e, "caps": " ".join(mem), "c0": c[0], "c1": c[1], "c2": c[2]} for e in ev[:4]]))
          PY

  scale:
    name: board at scale (${{ matrix.events }} events, caps ${{ matrix.caps }})
    needs: [build, scale-matrix]
    runs-on: ubuntu-latest
    # Up to three caps in a row, each with up to three 30-minute idle waits.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scale-matrix.outputs.plan) }}
    env:
      EVENTS: ${{ matrix.events }}
      PROFILE: ${{ github.event_name == 'schedule' && 'realistic' || inputs.scale_profile }}
      GEN: ${{ github.workspace }}/.scale-gen
      BIN: ${{ github.workspace }}/bin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: perf-bin
          path: bin
      # An artifact does not keep the exec bit.
      - run: chmod +x bin/openlens bin/openlens-cli bin/xtask
      # bench-gen writes the 90 days before now and rolls up the closed
      # ones, so the app depends on the UTC day: the cache only serves runs
      # of the same day (a dispatch again with other caps, a re-run).
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.GEN }}
          key: scale-data-v1-${{ matrix.events }}-${{ env.PROFILE || 'default' }}-${{ steps.day.outputs.day }}-${{ hashFiles('xtask/src/bench_gen.rs', 'crates/query/src/rollup.rs', 'crates/storage/src/**', 'crates/testkit/src/**', 'Cargo.lock') }}
      - name: generate
        id: gen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GEN"; mkdir -p "$GEN"
          gen_start=$(date +%s)
          args=(--events "$EVENTS" --map-out "$GEN/map.yaml")
          case "$PROFILE" in
            realistic|persona) args+=(--profile "$PROFILE") ;;
          esac
          "$BIN/xtask" bench-gen "$GEN/data" "${args[@]}" > "$GEN/gen.json"
          echo "GEN_SECONDS=$(( $(date +%s) - gen_start ))" >> "$GITHUB_ENV"
      # Saved before any server runs on it: each cap works on a copy.
      - if: steps.gen.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ${{ env.GEN }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: memory cgroup
        if: matrix.c0 != 'nocap'
        run: |
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null || true
          sudo mkdir -p /sys/fs/cgroup/openlens
      # One step per cap, so a cap that fails does not stop the next one.
      - name: measure, cap ${{ matrix.c0 }}
        if: ${{ !cancelled() && matrix.c0 != '' && (steps.cache.outputs.cache-hit == 'true' || steps.gen.outcome == 'success') }}
        env:
          CACHED: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: bash .github/scripts/perf-scale-cap.sh "${{ matrix.c0 }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && matrix.c0 != '' }}
        with:
          name: scale-${{ matrix.events }}-${{ matrix.c0 }}
          path: |
            out/${{ matrix.c0 }}/scale.json
            out/${{ matrix.c0 }}/queries.txt
            out/${{ matrix.c0 }}/diag.txt
            out/${{ matrix.c0 }}/server.log
      - name: measure, cap ${{ matrix.c1 }}
        if: ${{ !cancelled() && matrix.c1 != '' && (steps.cache.outputs.cache-hit == 'true' || steps.gen.outcome == 'success') }}
        env:
          CACHED: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: bash .github/scripts/perf-scale-cap.sh "${{ matrix.c1 }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && matrix.c1 != '' }}
        with:
          name: scale-${{ matrix.events }}-${{ matrix.c1 }}
          path: |
            out/${{ matrix.c1 }}/scale.json
            out/${{ matrix.c1 }}/queries.txt
            out/${{ matrix.c1 }}/diag.txt
            out/${{ matrix.c1 }}/server.log
      - name: measure, cap ${{ matrix.c2 }}
        if: ${{ !cancelled() && matrix.c2 != '' && (steps.cache.outputs.cache-hit == 'true' || steps.gen.outcome == 'success') }}
        env:
          CACHED: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: bash .github/scripts/perf-scale-cap.sh "${{ matrix.c2 }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && matrix.c2 != '' }}
        with:
          name: scale-${{ matrix.events }}-${{ matrix.c2 }}
          path: |
            out/${{ matrix.c2 }}/scale.json
            out/${{ matrix.c2 }}/queries.txt
            out/${{ matrix.c2 }}/diag.txt
            out/${{ matrix.c2 }}/server.log
