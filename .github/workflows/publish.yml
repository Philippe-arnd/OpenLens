name: Release
# The tag in the run's title, so scripts/release/summary.sh finds a run
# started on main with `-f tag=…` (the release train does that).
run-name: Release ${{ inputs.tag || github.ref_name }}

# Builds the release assets and the GitHub release:
# - on every push to main (code changes): a build release vX.Y.Z-YYMMDD-sha,
#   where X.Y.Z is the version being developed (Cargo.toml), YYMMDD the UTC
#   date and sha the commit. SemVer-valid (a pre-release of X.Y.Z), marked
#   pre-release until X.Y.Z itself is tagged. A newer push cancels an older
#   build. The image and chart workflows are started for that tag too;
# - on v* tags (pushed by a maintainer, see docs/development.md#releasing);
# - on demand with `tag`: rebuild and re-attach the assets of an existing tag;
# - on demand with `snapshot`: the same as a push to main, now.
# Assets: Linux x86_64 and aarch64 binaries, the SDK bundles, the Helm chart, SHA256SUMS.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "examples/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: false
      snapshot:
        description: "Tag main as a pre-release snapshot first"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      ref: ${{ steps.t.outputs.ref }}
      new: ${{ steps.t.outputs.new }}
      prev: ${{ steps.t.outputs.prev }}
      pre: ${{ steps.t.outputs.pre }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=false; ref=""
          # A dispatched `tag` wins: the release train dispatches from main,
          # where the push rule below would build a snapshot instead (v0.3.0).
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ inputs.snapshot }}" = "true" ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            # A build release: the tag is created with the release, at the end.
            v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            tag="v$v-$(date -u +%y%m%d)-$(git rev-parse --short=7 HEAD)"
            ref=$(git rev-parse HEAD); new=true
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "$new" = false ]; then
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null || { echo "no tag $tag"; exit 1; }
            ref="$tag"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "new=$new" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          if [ "$pre" = true ]; then
            prev=$(git tag --list 'v*' --sort=-creatordate | grep -vx "$tag" | head -1)
          else
            prev=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | grep -vx "$tag" | head -1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"; echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "tag $tag, previous ${prev:-none}, pre-release $pre"

  binaries:
    needs: prepare
    strategy:
      matrix:
        include:
          # Older glibc than ubuntu-latest, so the binaries run on more hosts.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.arch }}
      - name: binaries
        run: |
          cargo build --release --locked -p openlens -p openlens-cli
          d="openlens-$TAG-${{ matrix.arch }}-linux"
          mkdir -p "dist/$d"
          cp target/release/openlens target/release/openlens-cli LICENSE README.md CHANGELOG.md "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          rm -rf "dist/$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz

  assets:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: SDK bundles
        run: |
          d="openlens-sdk-web-$TAG"
          mkdir -p "dist/$d"
          cp sdk/js/dist/*.js sdk/js/dist/*.css sdk/js/dist/*.d.ts sdk/js/README.md "dist/$d/"
          if [ -f sdk/js/licenses/rrweb-LICENSE.txt ]; then cp sdk/js/licenses/rrweb-LICENSE.txt "dist/$d/"; fi
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          rm -rf "dist/$d"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Helm chart
        # Releases before the chart existed (v0.1.x) ship without it.
        if: hashFiles('deploy/helm/openlens/Chart.yaml') != ''
        run: helm package deploy/helm/openlens --version "${TAG#v}" --app-version "$TAG" --destination dist
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/

  release:
    needs: [prepare, assets]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PREV: ${{ needs.prepare.outputs.prev }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own ref: the tag when a tag starts it, main when run
      # by hand, so older tags get the current notes script and CHANGELOG.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: dist
      - name: notes
        run: scripts/release/notes.sh "$TAG" "$PREV" "${{ needs.prepare.outputs.ref }}" > notes.md && cat notes.md
      - name: create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          elif [ "${{ needs.prepare.outputs.new }}" = true ]; then
            # Creates the tag on that commit, then starts the image and chart
            # workflows for it (a tag made with this token starts none).
            gh release create "$TAG" dist/* --title "OpenLens $TAG" --notes-file notes.md \
              --target "${{ needs.prepare.outputs.ref }}" --prerelease
            gh workflow run release.yml --ref "$TAG"
            gh workflow run k8s.yml --ref "$TAG"
          else
            pre=""; [ "${{ needs.prepare.outputs.pre }}" = true ] && pre="--prerelease"
            gh release create "$TAG" dist/* --title "OpenLens $TAG" --notes-file notes.md --verify-tag $pre
          fi
