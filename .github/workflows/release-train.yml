name: Release train

# Stable releases without a person (#197). Every Tuesday morning (after
# Monday's dependency updates had a day of nightlies), cut the version in
# Cargo.toml as vX.Y.Z when:
# - the CHANGELOG has something under [Unreleased];
# - the last nightly CI and image runs on main are green (the image run
#   includes the upgrade check from the previous release);
# - no open issue carries `release-blocker` or `release-hold`.
# Then: tag main, publish (binaries, chart, image, which redeploys Coolify),
# and open a PR that names the version in the CHANGELOG and moves main to
# the next minor version (main only takes PRs; it merges itself).
# Hotfixes of an older minor stay manual (a release branch and a tag).
on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and print what would be released, change nothing"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: decide
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          skip() { echo "::notice::no release: $1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && skip "$tag already exists (bump Cargo.toml after a release)"
          unreleased=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '^- ' || true)
          [ "$unreleased" -gt 0 ] || skip "nothing under [Unreleased]"
          for wf in ci.yml release.yml; do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event schedule --limit 1 --json conclusion -q '.[0].conclusion')
            [ "$c" = success ] || skip "last nightly $wf on main is '$c'"
          done
          for l in release-blocker release-hold; do
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$l" --state open --json number -q 'length')
            [ "$n" = 0 ] || skip "$n open issue(s) labelled $l"
          done
          echo "::notice::releasing $tag ($unreleased changelog entries)"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: release
        if: steps.d.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.d.outputs.version }}
          TAG: ${{ steps.d.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "openlens-release-train"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(date -u +%Y-%m-%d)
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | head -1)
          # 1. main is protected (PRs only); tags are not. Tag the tested
          #    commit as it is: the notes read [Unreleased] (notes.sh).
          git tag -a "$TAG" -m "OpenLens $TAG"
          git push origin "$TAG"
          # 2. A tag pushed with this token starts no workflow: start them.
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run release.yml --ref "$TAG"
          gh workflow run k8s.yml --ref "$TAG"
          # 2b. An hour later, check that every part landed (#258).
          gh workflow run release-summary.yml -f tag="$TAG" -f wait_minutes=60 || true
          # 3. A PR names the release in the CHANGELOG and moves main to the
          #    next minor version (docs/development.md), then merges itself.
          IFS=. read -r major minor _ <<< "$V"
          next="$major.$((minor + 1)).0"
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$V] - $today/" CHANGELOG.md
          sed -i "s#^\[Unreleased\]: .*#[Unreleased]: https://github.com/$GITHUB_REPOSITORY/compare/$TAG...HEAD\n[$V]: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG#" CHANGELOG.md
          sed -i "0,/^version = \"$V\"/s//version = \"$next\"/" Cargo.toml
          cargo update -w --offline -q || cargo update -w -q
          branch="release/develop-$next"
          git checkout -q -b "$branch"
          git commit -qam "Release $TAG, develop $next"
          git push -q origin "$branch"
          body="Names $TAG in the CHANGELOG and moves main to $next. Opened by the release train."
          if url=$(gh pr create --base main --head "$branch" --title "Release $TAG, develop $next" --body "$body") \
             && gh pr merge "$url" --merge --delete-branch; then
            echo "::notice::released $TAG; main is now $next ($url)"
          else
            gh issue create --title "Release train: merge $branch" --label release-hold \
              --body "$TAG is published, but the follow-up PR could not be opened or merged by the workflow token. Open and merge \`$branch\` (or allow GitHub Actions to create pull requests in Settings → Actions). The \`release-hold\` label stops the next train until then." || true
            echo "::warning::released $TAG; open and merge $branch by hand"
          fi
