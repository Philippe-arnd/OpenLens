name: Release train

# Stable releases without a person (#197). Every Tuesday morning (after
# Monday's dependency updates had a day of nightlies), cut the version in
# Cargo.toml as vX.Y.Z when:
# - the CHANGELOG has something under [Unreleased];
# - the last nightly CI and image runs on main are green (the image run
#   includes the upgrade check from the previous release);
# - no open issue carries `release-blocker` or `release-hold`.
# Then: tag main, publish (binaries, chart, image, which redeploys Coolify),
# and open a PR that names the version in the CHANGELOG and moves main to
# the next minor version (main only takes PRs; it merges itself).
# Hotfixes of an older minor stay manual (a release branch and a tag).
on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and print what would be released, change nothing"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: decide
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          skip() { echo "::notice::no release: $1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && skip "$tag already exists (bump Cargo.toml after a release)"
          unreleased=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '^- ' || true)
          [ "$unreleased" -gt 0 ] || skip "nothing under [Unreleased]"
          for wf in ci.yml release.yml; do
            c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event schedule --limit 1 --json conclusion -q '.[0].conclusion')
            [ "$c" = success ] || skip "last nightly $wf on main is '$c'"
          done
          for l in release-blocker release-hold; do
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$l" --state open --json number -q 'length')
            [ "$n" = 0 ] || skip "$n open issue(s) labelled $l"
          done
          echo "::notice::releasing $tag ($unreleased changelog entries)"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: release
        if: steps.d.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: a fine-grained token (contents + pull requests: write)
          # opens the follow-up PR when the repository does not let GitHub
          # Actions create pull requests; a PR it opens also starts CI.
          PR_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          V: ${{ steps.d.outputs.version }}
          TAG: ${{ steps.d.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "openlens-release-train"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(date -u +%Y-%m-%d)
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | head -1)
          # 1. main is protected (PRs only); tags are not. Tag the tested
          #    commit as it is: the notes read [Unreleased] (notes.sh).
          git tag -a "$TAG" -m "OpenLens $TAG"
          git push origin "$TAG"
          # 2. A tag pushed with this token starts no workflow: start them.
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run release.yml --ref "$TAG"
          gh workflow run k8s.yml --ref "$TAG"
          # The site and its screenshots follow `release: published`, which a
          # release made with this token does not send either. The
          # screenshots job waits for the release, merges its images, then
          # rebuilds Pages (#439): one start, in that order.
          gh workflow run screenshots.yml --ref main -f tag="$TAG" || true
          # 2b. An hour later, check that every part landed (#258).
          gh workflow run release-summary.yml -f tag="$TAG" -f wait_minutes=60 || true
          # 3. A PR names the release in the CHANGELOG and moves main to the
          #    next minor version (docs/development.md), then merges itself.
          IFS=. read -r major minor _ <<< "$V"
          next="$major.$((minor + 1)).0"
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$V] - $today/" CHANGELOG.md
          sed -i "s#^\[Unreleased\]: .*#[Unreleased]: https://github.com/$GITHUB_REPOSITORY/compare/$TAG...HEAD\n[$V]: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG#" CHANGELOG.md
          sed -i "0,/^version = \"$V\"/s//version = \"$next\"/" Cargo.toml
          # Only the workspace's own versions move (no dependency update).
          cargo update -w -q
          # The npm SDKs follow it too: npm.yml publishes a tag only when
          # the package version matches it.
          sed -i "/\"name\": \"@openlens-obs\/\(web\|node\)\"/{n;s/\"version\": \"$V\"/\"version\": \"$next\"/}" \
            sdk/js/package.json sdk/js/package-lock.json sdk/node/package.json examples/tasks-spa/package-lock.json
          # Plain-manifest and chart defaults name the release just cut.
          sed -i "s/^appVersion: .*/appVersion: \"$TAG\"/; s/^version: .*/version: $V/" deploy/helm/openlens/Chart.yaml
          sed -i -E "s/^(\s*newTag:) .*/\\1 $TAG/" deploy/k8s/example/kustomization.yaml
          # The Coolify template and the Swarm stack follow the minor
          # channel of the newest release (#198): new installs start there.
          sed -i -E "s#(ghcr.io/philippe-arnd/openlens):[0-9]+\.[0-9]+\$#\\1:$major.$minor#" deploy/coolify/openlens.yaml deploy/swarm/openlens.yaml
          scripts/render-k8s.sh
          branch="release/develop-$next"
          git checkout -q -b "$branch"
          git commit -qam "Release $TAG, develop $next"
          git push -q origin "$branch"
          body="Names $TAG in the CHANGELOG and moves main to $next. Opened by the release train."
          # A PR opened with this token starts no CI: start it on the branch
          # (its checks land on the same commit), wait, then merge.
          merged() {
            url=$(GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$branch" --title "Release $TAG, develop $next" --body "$body") || return 1
            gh workflow run ci.yml --ref "$branch" || return 1
            sleep 20
            run=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$run" ] && gh run watch "$run" --exit-status --interval 60 > /dev/null || return 1
            GH_TOKEN="$PR_TOKEN" gh pr merge "$url" --merge --delete-branch
          }
          if merged; then
            echo "::notice::released $TAG; main is now $next ($url)"
          else
            gh issue create --title "Release train: merge $branch" --label release-hold \
              --body "$TAG is published, but the follow-up PR could not be opened or merged by the workflow token. Open and merge \`$branch\`. If the log says *GitHub Actions is not permitted to create or approve pull requests*, tick *Allow GitHub Actions to create and approve pull requests* in Settings → Actions → General, or add a \`RELEASE_TOKEN\` repository secret (fine-grained, contents and pull requests: write). The PR touches \`deploy/\` and \`Cargo.toml\`, which need the code owner's review: with the workflow token as author, the owner approves it (or \`RELEASE_TOKEN\` belongs to the owner). The \`release-hold\` label stops the next train until then." || true
            echo "::warning::released $TAG; open and merge $branch by hand"
          fi
