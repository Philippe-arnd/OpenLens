name: Image

# The Docker image is built, started and smoke-tested (packaging: volume
# ownership, healthcheck, env), then published to GHCR:
# - nightly, on v* tags and on demand (always);
# - on main only when packaging changes, debounced: a newer push cancels an
#   older build, so a burst of merges builds once.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - deploy/**
      - Cargo.lock
      - scripts/smoke.sh
      - .github/workflows/release.yml
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build, smoke-test, publish ghcr.io/philippe-arnd/openlens
    runs-on: ubuntu-latest
    env:
      OPENLENS_ADMIN_TOKEN: adm_ci_smoke
      OPENLENS_PROJECT_KEY: pk_ci_smoke
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: build (cargo-chef dependency layer, GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openlens-openlens:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: start the container exactly as Coolify does (compose, named volume, healthcheck)
        run: docker compose up -d --wait --wait-timeout 60
      - run: scripts/smoke.sh http://localhost:8686
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philippe-arnd/openlens
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
      - name: publish (reuses the cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Docker image broken on ${GITHUB_SHA::7}" \
            --body "Building, starting or smoke-testing the image failed. Run: $RUN"
