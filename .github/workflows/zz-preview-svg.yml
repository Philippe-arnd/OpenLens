name: preview svg (temporary)
on: push
jobs:
  shot:
    if: github.ref == 'refs/heads/docs/readme-blob'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install chromium >/dev/null
          cat > s.mjs <<'X'
          import { chromium } from "playwright";
          import { readFileSync } from "node:fs";
          const b = await chromium.launch(); const p = await b.newPage({ deviceScaleFactor: 1 });
          for (const [f, bg] of [["logo", "#ffffff"], ["logo", "#0d1117"]]) {
            const svg = readFileSync(`${process.env.GITHUB_WORKSPACE}/docs/img/${f}.svg`, "utf8");
            await p.setContent(`<body style="margin:0;padding:16px;background:${bg}">${svg}</body>`);
            await p.waitForTimeout(300);
            await p.locator("svg").first().screenshot({ path: `/tmp/p/${f}-${bg.slice(1)}.png` });
          }
          await b.close();
          X
          node s.mjs
      - uses: actions/upload-artifact@v5
        with: { name: svg, path: /tmp/p/*.png }
