name: preview svg (temporary)
on: push
jobs:
  shot:
    if: github.ref == 'refs/heads/docs/readme-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install chromium >/dev/null
          cat > s.mjs <<'X'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage({ deviceScaleFactor: 1 });
          for (const [f, bg] of [["wordmark", "#ffffff"], ["wordmark", "#0d1117"], ["architecture", "#ffffff"], ["architecture", "#0d1117"]]) {
            await p.setContent(`<body style="margin:0;padding:16px;background:${bg}"><img src="file://${process.env.GITHUB_WORKSPACE}/docs/img/${f}.svg"></body>`);
            await p.waitForTimeout(300);
            await p.screenshot({ path: `/tmp/p/${f}-${bg.slice(1)}.png`, fullPage: true });
          }
          await b.close();
          X
          node s.mjs
      - uses: actions/upload-artifact@v5
        with: { name: svg, path: /tmp/p/*.png }
