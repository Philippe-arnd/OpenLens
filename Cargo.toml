[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/Philippe-arnd/openlens"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
zstd = { version = "0.13", default-features = false }
datafusion = { version = "54.2.0", default-features = false, features = ["sql", "parquet", "nested_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions"] }
arrow = { version = "58.4.2", default-features = false, features = ["json"] }
parquet = { version = "58.4.2", default-features = false, features = ["arrow", "zstd"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
maud = { version = "0.27", features = ["axum"] }
rand = "0.9"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_norway = "0.9"
ureq = { version = "3", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
serde_urlencoded = "0.7"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# DataFusion makes full debug info huge (tens of GB of target/). Line tables
# keep backtraces useful at a fraction of the size and link time.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Optimised build without LTO: fast enough to compile locally for perf checks.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
