# Dependency licence allowlist. A licence not listed here needs a decision
# recorded in docs/decisions.md before the dependency can land.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "ISC",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # Our own crates.
  "AGPL-3.0-only",
]
# MPL-2.0 is accepted only for unmodified third-party crates; add per crate:
# exceptions = [{ allow = ["MPL-2.0"], crate = "name" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Each ignore needs its reason, and is reviewed when its dependency moves.
ignore = [
  # chrono is "unmaintained" (no fix exists). Arrow and DataFusion depend on
  # it for every timestamp, so it cannot be dropped; nothing is vulnerable.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no alternative: arrow/datafusion depend on chrono" },
  # chrono-tz, same reason (arrow's time-zone support, and D-017).
  { id = "RUSTSEC-2026-0555", reason = "unmaintained, no alternative: arrow's time-zone support depends on chrono-tz" },
]
