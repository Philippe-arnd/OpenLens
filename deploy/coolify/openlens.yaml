# documentation: https://github.com/Philippe-arnd/openlens/blob/main/docs/deploy/coolify.md
# slogan: Product analytics for PMs, wired by agents. One binary, no setup.
# tags: analytics, product, self-hosted, rust
# port: 8686

# One-click OpenLens for Coolify. No variable to fill in:
# - the public URL comes from Coolify (SERVICE_FQDN_*),
# - the admin token is generated by Coolify (SERVICE_PASSWORD_64_*) and shown
#   in the service's Environment Variables tab,
# - projects (and their capture keys) are created by your agent: /agents.md.
services:
  openlens:
    image: ghcr.io/philippe-arnd/openlens:latest
    environment:
      - SERVICE_FQDN_OPENLENS_8686
      - OPENLENS_ADMIN_TOKEN=${SERVICE_PASSWORD_64_OPENLENSADMIN}
    volumes:
      - openlens-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/openlens", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  openlens-data:
