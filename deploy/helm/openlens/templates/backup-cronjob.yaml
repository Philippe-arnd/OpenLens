{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openlens.fullname" . }}-backup
  labels: {{- include "openlens.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # The data volume is ReadWriteOnce: run next to the OpenLens pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {{- include "openlens.selector" . | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: {{ include "openlens.image" . | quote }}
              imagePullPolicy: {{ include "openlens.pullPolicy" . }}
              args: ["backup", "--into", "{{ if .Values.backup.existingClaim }}/backups{{ else }}/data/backups{{ end }}", "--keep", "{{ int .Values.backup.keep }}"]
              env:
                - name: OPENLENS_DATA_DIR
                  value: /data
              securityContext: {{- include "openlens.securityContext" . | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                {{- if .Values.backup.existingClaim }}
                - name: backups
                  mountPath: /backups
                {{- end }}
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "openlens.fullname" . }}-0
            {{- if .Values.backup.existingClaim }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim }}
            {{- end }}
            - name: tmp
              emptyDir: {}
{{- end }}
