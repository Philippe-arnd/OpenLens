{{- if not .Values.adminToken.existingSecret }}
{{- $name := include "openlens.tokenSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "openlens.labels" . | nindent 4 }}
  annotations:
    # Keep the token if the release is uninstalled: the data volume still trusts it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data .Values.adminToken.key) }}
  {{ .Values.adminToken.key }}: {{ index $old.data .Values.adminToken.key }}
  {{- else }}
  {{ .Values.adminToken.key }}: {{ printf "adm_%s" (randAlphaNum 40) | b64enc }}
  {{- end }}
{{- end }}
