{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: OpenLens is a single writer (write-ahead log and SQLite on one volume). See docs/deploy/kubernetes.md." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openlens.fullname" . }}
  labels: {{- include "openlens.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "openlens.fullname" . }}
  selector:
    matchLabels: {{- include "openlens.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openlens.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: openlens
          image: {{ include "openlens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8686
          env:
            - name: OPENLENS_ADDR
              value: "0.0.0.0:8686"
            - name: OPENLENS_DATA_DIR
              value: /data
            - name: OPENLENS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openlens.tokenSecret" . }}
                  key: {{ .Values.adminToken.key }}
                  {{- if and .Values.adminToken.existingSecret .Values.adminToken.optional }}
                  optional: true
                  {{- end }}
            {{- with (include "openlens.publicUrl" .) }}
            - name: OPENLENS_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: TMPDIR
              value: /tmp
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- include "openlens.securityContext" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "openlens.selector" . | nindent 10 }}
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
