apiVersion: v1
kind: Pod
metadata:
  name: {{ include "openlens.fullname" . }}-healthz
  labels: {{- include "openlens.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    # Reaches OpenLens through its Service, as an app or an agent in the cluster would.
    - name: healthz
      image: busybox:1.37
      command: ["wget", "-q", "-O", "-", "http://{{ include "openlens.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext: {{- include "openlens.securityContext" . | nindent 8 }}
