# OpenLens needs no value to run: `helm install openlens <chart>` is enough.
# Everything below is optional.

image:
  repository: ghcr.io/philippe-arnd/openlens
  # Defaults to the chart's appVersion (the matching OpenLens release), or
  # to its minor channel (for example 0.5) with autoUpdate.enabled.
  tag: ""
  # Always with autoUpdate.enabled.
  pullPolicy: IfNotPresent

# OpenLens is a single writer (write-ahead log + SQLite on one volume):
# exactly one replica. Any other value is refused at install.
replicaCount: 1

adminToken:
  # Use your own Secret (key below) instead of the generated one.
  existingSecret: ""
  key: admin-token
  # With existingSecret: start even if that Secret is missing. OpenLens then
  # generates a token, stores it in its volume and prints it in its log.
  optional: false

# Public URL of the dashboard, used in emailed links (digest). Defaults to
# https://<ingress.host> when the Ingress is enabled.
publicUrl: ""

persistence:
  size: 10Gi
  # Empty: the cluster's default storage class.
  storageClass: ""
  accessModes: [ReadWriteOnce]

service:
  type: ClusterIP
  port: 8686

ingress:
  enabled: false
  className: ""
  host: ""
  # Serve HTTPS from a TLS Secret (default name: <release>-openlens-tls).
  # With cert-manager, add its annotation below and the Secret is created for you.
  tls: false
  tlsSecretName: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt

# Optional features (SMTP digest, LLM rewording, OIDC, S3 copy) read their
# OPENLENS_* variables from Secrets or ConfigMaps you create (never values):
# extraEnvFrom:
#   - secretRef:
#       name: openlens-options
extraEnvFrom: []
extraEnv: []

# About 80k events/s per vCPU (docs/benchmarks.md): small apps need little.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Scheduled `openlens backup --into <dir> --keep <keep>` (consistent while
# the server runs). By default the copies go to `backups/` on the data volume:
# that protects against mistakes and corruption, not against losing the
# volume, and each copy takes the size of the data. Point existingClaim at
# another PVC (same node: the data volume is ReadWriteOnce), or use the S3
# copy, to keep them elsewhere.
backup:
  enabled: false
  schedule: "17 3 * * *"
  keep: 3
  existingClaim: ""

# Opt-in hands-off updates (#198): a CronJob runs `kubectl rollout restart`
# on the StatefulSet, and the new pod pulls the channel tag again (pull
# policy Always). The image follows a channel: image.tag empty (the chart's
# minor, patches only) or `latest`; a pinned release, a digest or `edge` is
# refused. One replica: each run is a short restart, even with no new image.
# It gets its own ServiceAccount, allowed to read and restart this
# StatefulSet only. With Argo CD or Flux, use their image automation
# instead (docs/deploy/kubernetes.md).
autoUpdate:
  enabled: false
  schedule: "47 4 * * *"

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
