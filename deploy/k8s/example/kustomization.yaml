# An example overlay: own namespace, pinned image, Ingress on your host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openlens
resources:
  - namespace.yaml
  - ../base
components:
  - ../components/ingress
images:
  - name: ghcr.io/philippe-arnd/openlens
    newTag: v0.6.1
patches:
  - target: { kind: Ingress, name: openlens }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: lens.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lens.example.com
