<div class="auth" style="position: relative">
<form class="card auth-card" action="board-v2.html" method="get" aria-labelledby="login-h">
<div class="brand" style="padding: 0"><span class="brand-mark" aria-hidden="true"></span>OpenLens</div>
<div class="stack gap-8">
<h1 id="login-h">Sign in</h1>
<p>Paste the admin token, or open the login link your agent sent you.</p>
</div>
<label class="field" style="font-size: 13px; color: var(--ink); font-weight: 500">Admin token<input name="token" type="password" autocomplete="current-password" spellcheck="false" placeholder="ol_admin_…"></label>
<a class="btn primary" href="board-v2.html">Open my board</a>
<div class="or">or</div>
<p style="font-size: 13px">Ask your agent for a link: <code>openlens-cli login-link --email you@…</code></p>
</form>
<p class="auth-foot" style="position: absolute; bottom: 20px">OpenLens 0.6.0</p>
</div>
