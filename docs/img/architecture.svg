<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Apps send events through the browser SDK or the server SDKs to POST /capture; events go to a write-ahead log, then daily Parquet files, with metadata in SQLite; DataFusion queries them; the engine applies the method and serves the Focus board, the MCP server and CLI for agents, and the weekly digest. All in one binary.">
  <style>
    .t { font: 600 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .s { font: 400 12px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #fff; opacity: .9; }
    .l { font: 500 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8b8fa3; }
    .a { stroke: #8b8fa3; stroke-width: 2; fill: none; marker-end: url(#h); }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b8fa3"/></marker>
  </defs>
  <!-- the one binary -->
  <rect x="220" y="20" width="660" height="260" rx="18" fill="none" stroke="#8b8fa3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="236" y="44" class="l">one binary · one data directory</text>

  <!-- sources -->
  <rect x="20" y="60" width="170" height="70" rx="12" fill="#e5486a"/>
  <text x="105" y="90" text-anchor="middle" class="t">Your web app</text>
  <text x="105" y="110" text-anchor="middle" class="s">c.js or @openlens/web</text>
  <rect x="20" y="170" width="170" height="70" rx="12" fill="#e5486a"/>
  <text x="105" y="200" text-anchor="middle" class="t">Your backend</text>
  <text x="105" y="220" text-anchor="middle" class="s">Node, Python, HTTP</text>
  <path class="a" d="M190 95 C215 95 225 140 248 140"/>
  <path class="a" d="M190 205 C215 205 225 160 248 160"/>

  <!-- ingest and storage -->
  <rect x="250" y="115" width="120" height="70" rx="12" fill="#2f8cf0"/>
  <text x="310" y="145" text-anchor="middle" class="t">/capture</text>
  <text x="310" y="165" text-anchor="middle" class="s">batched, bounded</text>
  <path class="a" d="M370 150 L398 150"/>
  <rect x="400" y="70" width="140" height="70" rx="12" fill="#0e9f6e"/>
  <text x="470" y="100" text-anchor="middle" class="t">WAL → Parquet</text>
  <text x="470" y="120" text-anchor="middle" class="s">daily, zstd, ~11 B/event</text>
  <rect x="400" y="160" width="140" height="70" rx="12" fill="#0e9f6e"/>
  <text x="470" y="190" text-anchor="middle" class="t">SQLite</text>
  <text x="470" y="210" text-anchor="middle" class="s">projects, people, flags</text>

  <!-- query + method -->
  <path class="a" d="M540 105 C560 105 560 140 578 140"/>
  <path class="a" d="M540 195 C560 195 560 160 578 160"/>
  <rect x="580" y="115" width="130" height="70" rx="12" fill="#6d5efc"/>
  <text x="645" y="145" text-anchor="middle" class="t">The method</text>
  <text x="645" y="165" text-anchor="middle" class="s">DataFusion + feature map</text>

  <!-- outputs -->
  <path class="a" d="M710 135 C730 135 730 85 748 85"/>
  <path class="a" d="M710 150 L748 150"/>
  <path class="a" d="M710 165 C730 165 730 215 748 215"/>
  <rect x="750" y="55" width="115" height="56" rx="12" fill="#d99400"/>
  <text x="807" y="80" text-anchor="middle" class="t">Focus board</text>
  <text x="807" y="98" text-anchor="middle" class="s">for the PM</text>
  <rect x="750" y="122" width="115" height="56" rx="12" fill="#d99400"/>
  <text x="807" y="147" text-anchor="middle" class="t">MCP + CLI</text>
  <text x="807" y="165" text-anchor="middle" class="s">for agents</text>
  <rect x="750" y="189" width="115" height="56" rx="12" fill="#d99400"/>
  <text x="807" y="214" text-anchor="middle" class="t">Digest</text>
  <text x="807" y="232" text-anchor="middle" class="s">every Monday</text>
</svg>
