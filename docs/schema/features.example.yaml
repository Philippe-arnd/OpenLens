# openlens.features.yaml: the feature map an app's agents maintain (draft, M2).
version: 1
churn_after_days: 14   # optional; the only tunable. Everything else has fixed definitions (docs/kpis.md).
# churn_event: subscription_cancelled   # optional: an explicit cancel counts as churn at once (D-019)

# Canonical roles, and the raw identify() values that map to them (first match wins).
roles:
  - key: admin
    match: ["owner", "superadmin", "admin"]
  - key: coach
    match: ["coach", "therapist"]
  - key: member
    match: ["user", "member", "team_*"]
# Optional (#712, D-103): the plans the app sells, lowest first, and the raw
# identify() plan values that map to them (first match wins). `paid` defaults
# to true: write `paid: false` on the free plan. Without this section plan
# changes are still kept, but upgrades, downgrades and conversion are not shown.
plans:
  - key: free
    match: ["free", "trial"]
    paid: false
  - key: pro
    match: ["pro", "pro_*"]
  - key: team
    match: ["team", "business"]
features:
  - key: write-entry
    name: Write a journal entry
    purpose: The core loop; users capture their day in four sections.
    owner: product
    entry:
      routes: ["/entries/new", "/entries/:id/edit"]
      selectors: ['[data-feature="write-entry"]']
    steps: [open_editor, fill_section, save_entry]
    success: entry_saved
    area: Journal            # optional: one-level group for the board and the map
    renamed_from: [editor]   # optional: former keys; their events count here
    server: ["POST /api/entries"]  # optional: key actions on the server (route stats, #594)
    paths: ["src/entries/**", "src/editor/*.ts"]  # optional: code paths, so a release's changed files name the features it touched (#576)
  - key: ai-insights
    name: AI insights
    purpose: Weekly reflection generated from past entries.
    entry:
      routes: ["/insights"]
      calls: ["openlens.feature('ai-insights')"]
    success: insight_viewed
    area: Journal
    requires: [write-entry]  # optional: features used before this one (adoption ladder)
